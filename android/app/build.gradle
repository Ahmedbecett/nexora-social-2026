apply plugin: 'com.android.application'

android {
    namespace "com.ahmedbecetti.nexora"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ahmedbecetti.nexora"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 44
        versionName "4.3.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // توقيع نسخة الإصدار: إن وُفّرت متغيرات البيئة (NEXORA_KEYSTORE / NEXORA_KEYSTORE_PASSWORD)
    // يُوقَّع بمفتاح الإنتاج (كما في GitHub Actions)؛ وإلا يُوقَّع بمفتاح التصحيح حتى تُبنى
    // حزمة تثبيت تلقائيًا على كل الأجهزة دون أسرار.
    def releaseStore = System.getenv("NEXORA_KEYSTORE")
    def releasePass = System.getenv("NEXORA_KEYSTORE_PASSWORD")
    def releaseAlias = System.getenv("NEXORA_KEY_ALIAS") ?: "nexora"
    def useReleaseKeystore = (releaseStore && releasePass)
    signingConfigs {
        release {
            if (useReleaseKeystore) {
                storeFile file(releaseStore)
                storePassword releasePass
                keyAlias releaseAlias
                keyPassword (System.getenv("NEXORA_KEY_PASSWORD") ?: releasePass)
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (useReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // لا مفتاح إنتاج مضبوط على هذه البيئة → توقيع تصحيح حتى تُبنى حزمة تثبيت تلقائيًا
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Google auth requires generated Firebase resources, not the plugin's placeholder client ID.
// Debug builds can still run the email/password UI without Firebase configuration.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("google-services.json missing: native Google/phone sign-in is unavailable")
    tasks.configureEach { task ->
        if (task.name == 'preReleaseBuild') {
            task.doFirst {
                throw new GradleException("Release requires android/app/google-services.json. See docs/ci/README.md")
            }
        }
    }
}
