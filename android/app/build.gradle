apply plugin: 'com.android.application'

android {
    namespace "com.ahmedbecetti.nexora"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ahmedbecetti.nexora"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // v4.4.0 (44) — إصلاح رفض Amazon: زر Google كان معلّقًا + دخول حقيقي بالبريد
        versionCode 44
        versionName "4.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // توقيع نسخة الإصدار: إن وُفّرت متغيرات البيئة (NEXORA_KEYSTORE / NEXORA_KEYSTORE_PASSWORD)
    // يُوقَّع بمفتاح الإنتاج (كما في GitHub Actions)؛ وإلا يُوقَّع بمفتاح التصحيح حتى تُبنى
    // حزمة تثبيت تلقائيًا على كل الأجهزة دون أسرار.
    def releaseStore = System.getenv("NEXORA_KEYSTORE")
    def releasePass = System.getenv("NEXORA_KEYSTORE_PASSWORD")
    def releaseAlias = System.getenv("NEXORA_KEY_ALIAS") ?: "nexora"
    def useReleaseKeystore = (releaseStore && releasePass)
    signingConfigs {
        release {
            if (useReleaseKeystore) {
                storeFile file(releaseStore)
                storePassword releasePass
                keyAlias releaseAlias
                keyPassword (System.getenv("NEXORA_KEY_PASSWORD") ?: releasePass)
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (useReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // لا مفتاح إنتاج مضبوط على هذه البيئة → توقيع تصحيح حتى تُبنى حزمة تثبيت تلقائيًا
                signingConfig signingConfigs.debug
            }
        }
    }
}


repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

/* ==========================================================================
   NEXORA AI — تهيئة Firebase / Google Sign-In (Fire OS + Amazon Appstore)
   --------------------------------------------------------------------------
   المشكلة في النسخة 43: لم يكن google-services.json موجودًا في الحزمة، لكن
   إضافة المصادقة كانت تُشحن بمسار Google الكامل. على Fire OS (بلا Play
   Services) لم تُحمَّل الإضافة أصلًا، فبقي وعد JavaScript معلّقًا إلى الأبد
   وظهر الزر كأنه لا يستجيب — وهو ما رفضته Amazon.

   الحل:
   - إن وُجد google-services.json (أو GOOGLE_SERVICES_JSON) ⟹ تفعيل Google
     بالكامل (الواجهة الجديدة + التوقيع المُسجَّل).
   - إن غاب ⟹ استبعاد واجهة Google من الحزمة، وتصبح الإضافة خفيفة بلا مسار
     Google، والتطبيق يعمل بالبريد/الهاتف. لا تعليق ولا شاشة تحميل لا تنتهي.
   ========================================================================== */
def googleServicesFile = file('google-services.json')
// القرار يُتخذ في المشروع الجذر (android/build.gradle) قبل تهيئة الإضافات
def hasGoogleServices = rootProject.ext.has('rgcfaIncludeGoogle')
    ? rootProject.ext.rgcfaIncludeGoogle
    : (googleServicesFile.exists() && googleServicesFile.length() > 0)

if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
    logger.lifecycle("NEXORA: google-services.json موجود — تم تفعيل Firebase وGoogle Sign-In.")
} else {
    logger.lifecycle("NEXORA: تخطّي إضافة google-services (لا يوجد ملف تهيئة).")
}
