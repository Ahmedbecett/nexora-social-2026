name: Build Nexora APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: https://nexora-social-2026.vercel.app
      VITE_WEB_URL: https://nexora-social-2026.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install & build web app
        run: |
          npm ci
          npm run build
          rm -rf dist/download
          npx cap sync android

      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.NEXORA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/nexora.jks
            echo "NEXORA_KEYSTORE=$RUNNER_TEMP/nexora.jks" >> $GITHUB_ENV
          fi

      - name: Build release APK
        env:
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Nexora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-apk
          path: Nexora.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Nexora — latest Android build" --notes "Latest APK built automatically from main."
          gh release upload latest Nexora.apk --clobber
          gh release edit latest --notes "Latest APK built automatically from commit ${GITHUB_SHA::7}. Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Nexora.apk"
