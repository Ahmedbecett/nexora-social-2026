name: Build Windows Store package

# This workflow replaces the old PWABuilder image-service path, which returned
# 500/503 and could not produce a package. It builds the Hosted App Model MSIX
# locally on a Windows runner with the Microsoft Windows SDK.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish/replace the public release assets (only after a successful Windows install test)'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/windows-store-package.yml'
      - 'windows/scripts/Build-Msix.ps1'
      - 'windows/scripts/Test-MsixPackage.ps1'
      - 'windows/msix/**'
      - 'windows/package-identity.json'
      - 'public/manifest.webmanifest'

permissions:
  contents: write

jobs:
  windows-package:
    name: Build and publish MSIX
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Windows readiness
        shell: pwsh
        run: node windows/tools/check-windows.mjs

      - name: Build unsigned Store package and test-signed copy
        shell: pwsh
        run: ./windows/scripts/Build-Msix.ps1 -OutputDirectory dist/windows

      - name: Show output
        shell: pwsh
        run: Get-ChildItem dist/windows | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-4.4.0.0
          path: dist/windows/*
          if-no-files-found: error

      - name: Trust the ephemeral test certificate
        shell: powershell
        run: |
          $cert = Join-Path $PWD 'dist\windows\NEXORA-AI-test-certificate.cer'
          if (-not (Test-Path -LiteralPath $cert)) { throw "Test certificate missing: $cert" }
          Import-Certificate -FilePath $cert -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null
          Import-Certificate -FilePath $cert -CertStoreLocation Cert:\CurrentUser\Root | Out-Null

      - name: Install and inspect the package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem -LiteralPath 'dist\windows' -Filter '*.test-signed.msix' | Select-Object -First 1
          if (-not $msix) { throw 'The test-signed MSIX is missing from the build output.' }
          Write-Host "Installing $($msix.Name)"
          Add-AppxPackage -Path $msix.FullName -ForceApplicationShutdown

          $pkg = Get-AppxPackage -Name 'Ahmedbecetti.NEXORAAIbyBECETTI'
          if (-not $pkg) { throw 'Package registration did not produce an installed package.' }
          Write-Host "Installed: $($pkg.PackageFullName)"
          Write-Host "Status:    $($pkg.Status)"

          $manifest = Get-AppxPackageManifest -Package $pkg.PackageFullName
          $caps = @(
            $manifest.Package.Capabilities.SelectNodes("*[local-name()='Capability']") |
              ForEach-Object { $_.GetAttribute('Name') }
          )
          Write-Host "Capabilities: $($caps -join ', ')"
          if ($caps -contains 'runFullTrust') { throw 'runFullTrust is present in the installed package.' }
          if ($caps -notcontains 'internetClient') { throw 'internetClient is missing from the installed package.' }

          if (Get-Command Get-StartApps -ErrorAction SilentlyContinue) {
            $startApp = Get-StartApps |
              Where-Object { $_.AppID -like "$($pkg.PackageFamilyName)!*" } |
              Select-Object -First 1
            if (-not $startApp) { throw 'No Start entry was registered for the installed package.' }
            Write-Host "Start entry: $($startApp.Name) [$($startApp.AppID)]"
          }
          else {
            Write-Warning 'Get-StartApps is unavailable; Start-menu registration was not verified.'
          }

      - name: Launch through the Edge PWA host (best effort)
        shell: powershell
        continue-on-error: true
        run: |
          $pkg = Get-AppxPackage -Name 'Ahmedbecetti.NEXORAAIbyBECETTI'
          if (-not $pkg) { throw 'Package is not installed.' }
          $before = @(Get-Process -Name msedge -ErrorAction SilentlyContinue).Count
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!App"
          Start-Sleep -Seconds 15
          $after = @(Get-Process -Name msedge -ErrorAction SilentlyContinue).Count
          Write-Host "Edge processes before=$before after=$after"
          if ($after -le $before) { throw 'Edge host did not start within 15 seconds.' }

      - name: Uninstall
        shell: powershell
        if: always()
        run: |
          Get-AppxPackage -Name 'Ahmedbecetti.NEXORAAIbyBECETTI' |
            Remove-AppxPackage -ErrorAction SilentlyContinue

      # لا تُستبدل أصول Release تلقائياً من فرع تجريبي. النشر يتطلب
      # تشغيلاً يدوياً مع publish_release=true بعد اختبار التثبيت على Windows.
      - name: Publish GitHub release assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-v4.4.0.0'
          $notes = @'
          حزمة Windows الحقيقية لـ **NEXORA AI by BECETTI** (Hosted App Model).

          - `NEXORA-AI_4.4.0.0_neutral.msixupload` — ارفع هذا الملف إلى Partner Center. غير موقّع عمدًا؛ Microsoft Store يعيد توقيعه.
          - `NEXORA-AI_4.4.0.0_neutral.msixbundle` و`.msix` — نسخ فحص غير موقّعة.
          - `NEXORA-AI_4.4.0.0_neutral.test-signed.msix` + `NEXORA-AI-test-certificate.cer` — للاختبار المحلي فقط (تثبيت الشهادة في Trusted People). لا ترفعها إلى المتجر.
          - `SHA256SUMS.txt` و`BUILD-INFO.txt` — البصمات وتفاصيل البناء.

          الاسم المحجوز: `NEXORA AI by BECETTI` · الهوية: `Ahmedbecetti.NEXORAAIbyBECETTI` · `CN=A5D5DC31-4A15-4059-8030-D96C51054596` · الإصدار `4.4.0.0`.
          '@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "NEXORA AI by BECETTI · Windows 4.4.0.0" --notes $notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
          else {
            gh release edit $tag --title "NEXORA AI by BECETTI · Windows 4.4.0.0" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
          }
          gh release upload $tag dist/windows/* --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
