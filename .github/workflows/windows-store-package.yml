name: Build Windows Store package

# Builds the real Hosted App Model MSIX on a Windows runner with the Microsoft
# Windows SDK (makepri + makeappx + signtool), installs it with Add-AppxPackage,
# launches the Edge PWA host, checks the declared capabilities, and publishes the
# artifacts for Microsoft Partner Center.
#
# Release 4.4.1.0:
#   * Store name "NEXORA AI by BECETTI" in Properties and VisualElements;
#   * Package Identity Name / Publisher / PublisherDisplayName / PFN / Product ID unchanged;
#   * runFullTrust reviewed and justified (docs/windows/RUNFULLTRUST-REVIEW.md);
#   * .msix + .msixbundle + .msixupload (unsigned for the Store, which re-signs);
#   * Add-AppxPackage install test, Start entry, host launch, permission and identity checks.
on:
  workflow_dispatch:
    inputs:
      commit_artifacts:
        description: 'Commit the built packages and the verification JSON to this branch'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/windows-store-package.yml'
      - 'windows/**'
      - 'package.json'
      - 'public/manifest.webmanifest'

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Build, install and publish MSIX
    runs-on: windows-latest
    env:
      PKG_VERSION: 4.4.1.0
      PKG_BASE: NEXORA-AI
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify version and Windows readiness
        shell: pwsh
        run: |
          node windows/tools/sync-version.mjs --check
          if ($LASTEXITCODE -ne 0) { throw 'MSIX version does not match package.json' }
          node windows/tools/check-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows readiness check failed' }

      - name: Build unsigned Store package and test-signed copy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Start-Transcript -Path dist/build.log -Force | Out-Null
          try {
            ./windows/scripts/Build-Msix.ps1 -OutputDirectory dist/windows
            if ($LASTEXITCODE -ne 0) { throw "Build-Msix.ps1 exited with code $LASTEXITCODE" }
          }
          catch {
            $message = $_.Exception.Message
            Write-Host "::error title=MSIX build failed::$message"
            Stop-Transcript | Out-Null
            throw
          }
          Stop-Transcript | Out-Null

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: dist/build.log
          if-no-files-found: warn

      - name: Show package files
        shell: pwsh
        run: |
          Get-ChildItem dist/windows | Format-Table Name, Length
          Get-Content dist/windows/BUILD-INFO.txt

      - name: Validate the .msixupload for Partner Center (structure + block map + identity)
        shell: pwsh
        run: |
          $upload = "dist/windows/$($env:PKG_BASE)_$($env:PKG_VERSION)_neutral.msixupload"
          if (-not (Test-Path $upload)) { throw "missing $upload" }
          node windows/tools/verify-msix-upload.mjs $upload --json dist/windows/upload-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'The .msixupload is not structurally valid for Partner Center.' }
          $report = Get-Content dist/windows/upload-verification.json -Raw | ConvertFrom-Json
          $symbols = if (@($report.warnings).Count -gt 0) { $report.warnings -join '; ' } else { 'present' }
          $summary = @(
            '### Partner Center upload verification',
            "- upload: $([System.IO.Path]::GetFileName($upload)) ($((Get-Item $upload).Length) bytes)",
            "- identity: $($report.identity.displayName) / $($report.identity.name) / $($report.identity.version)",
            "- capabilities: $($report.identity.capabilities -join ', ')",
            "- structure: $($report.stats.family), $($report.stats.entries) entry, $($report.stats.manifestEntries) parts, $($report.stats.pngAssets) PNG",
            "- block map: $($report.stats.blockMapFiles) files, $($report.stats.verifiedBlocks) SHA-256 blocks verified",
            "- symbols: $symbols"
          )
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Validate the package with the official Windows SDK tools
        shell: pwsh
        run: |
          try {
            $model = Get-Content windows/package-identity.json -Raw | ConvertFrom-Json
            $work = Join-Path $env:RUNNER_TEMP ('appxcheck-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $work | Out-Null
            $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $makeappx = Get-ChildItem $sdkRoot -Filter makeappx.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            $makepri = Get-ChildItem $sdkRoot -Filter makepri.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $makeappx -or -not $makepri) { throw 'Windows SDK tools (makeappx/makepri) are missing' }
            Write-Host "makeappx: $makeappx"

            # 1) افتح الرفع ثم الـbundle بنفس ترتيب النظام، للحصول على حزمة MSIX الحقيقية
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $uploadPath = "dist/windows/$($env:PKG_BASE)_$($env:PKG_VERSION)_neutral.msixupload"
            $bundleName = @([System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $uploadPath)).Entries |
              Where-Object { $_.FullName -match '\.msixbundle$' } | ForEach-Object { $_.FullName })
            if ($bundleName.Count -ne 1) { throw "the upload must hold exactly one .msixbundle (found $($bundleName.Count))" }
            [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $uploadPath), (Join-Path $work 'upload'))
            $bundlePath = Join-Path (Join-Path $work 'upload') $bundleName[0]
            $innerName = @([System.IO.Compression.ZipFile]::OpenRead($bundlePath).Entries |
              Where-Object { $_.FullName -match '\.msix$' } | ForEach-Object { $_.FullName })
            if ($innerName.Count -ne 1) { throw "the bundle must hold exactly one .msix (found $($innerName.Count))" }
            [System.IO.Compression.ZipFile]::ExtractToDirectory($bundlePath, (Join-Path $work 'bundle'))
            $innerPath = Join-Path (Join-Path $work 'bundle') $innerName[0]

            # 2) makeappx يفك الحزمة ويتحقق من حاويتها
            $layout = Join-Path $work 'msix'
            & $makeappx unpack /p $innerPath /d $layout /o | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed with exit code $LASTEXITCODE" }
            if (Test-Path (Join-Path $layout 'AppxSignature.p7x')) { throw 'the Store upload must not contain AppxSignature.p7x' }
            Write-Host "makeappx unpack OK: $((Get-ChildItem $layout -Recurse -File).Count) files"

            # 3) الهوية والاسم المحجوز والإصدار والصلاحيات من المانيفست المستخرج
            [xml]$manifest = Get-Content (Join-Path $layout 'AppxManifest.xml') -Raw
            $identity = $manifest.Package.Identity
            if ($identity.Name -ne $model.identityName) { throw "Identity Name mismatch: $($identity.Name)" }
            if ($identity.Publisher -ne $model.publisher) { throw "Publisher mismatch: $($identity.Publisher)" }
            if ($identity.Version -ne $model.version) { throw "Version mismatch: $($identity.Version)" }
            if ($manifest.Package.Properties.DisplayName -ne $model.displayName) { throw "DisplayName mismatch: $($manifest.Package.Properties.DisplayName)" }
            if ($manifest.Package.Properties.PublisherDisplayName -ne $model.publisherDisplayName) { throw 'PublisherDisplayName mismatch' }
            $caps = @($manifest.Package.Capabilities.ChildNodes |
              Where-Object { $_.GetType().FullName -eq 'System.Xml.XmlElement' } |
              ForEach-Object { $_.GetAttribute('Name') } | Sort-Object)
            $expected = @($model.capabilities.required | Sort-Object)
            if (($caps -join ',') -ne ($expected -join ',')) { throw "Capability mismatch: $($caps -join ',') vs $($expected -join ',')" }
            $hostId = @($manifest.Package.Applications.Application.Extensions.Extension |
              Where-Object { $_.GetAttribute('Category') -eq 'windows.appUriHandler' }).Count
            Write-Host "identity/publisher/capabilities OK: $($identity.Name) $($identity.Version) [$($caps -join ', ')] uriHandlers=$hostId"

            # 4) resources.pri حقيقي: makepri يقرأه ويُخرِج تفريغًا غير فارغ
            $priDump = Join-Path $work 'pri.xml'
            & $makepri dump /if (Join-Path $layout 'resources.pri') /of $priDump /o | Out-Null
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $priDump)) { throw "makepri dump failed with exit code $LASTEXITCODE" }
            $dumpSize = (Get-Item $priDump).Length
            if ($dumpSize -lt 500) { throw "makepri dump produced only $dumpSize bytes" }
            Write-Host "makepri dump OK: $dumpSize bytes"

            # 5) إعادة تحزيم نفس التخطيط: makeappx يتحقق من المانيفست مقابل المخطط
            foreach ($generated in @('AppxBlockMap.xml', '[Content_Types].xml')) {
              $stale = Join-Path $layout $generated
              if (Test-Path $stale) { Remove-Item $stale -Force }
            }
            $repacked = Join-Path $work 'repacked.msix'
            & $makeappx pack /d $layout /p $repacked /o | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "makeappx pack (schema re-validation) failed with exit code $LASTEXITCODE" }
            Write-Host "makeappx pack re-validation OK: $((Get-Item $repacked).Length) bytes"

            @(
              '### Windows SDK validation (on the uploaded artefact)',
              "- makeappx unpack: exit 0, $((Get-ChildItem $layout -Recurse -File).Count) files",
              "- identity: $($identity.Name) / $($identity.Version) / $($manifest.Package.Properties.DisplayName)",
              "- capabilities: $($caps -join ', ')",
              "- makepri dump: $dumpSize bytes",
              "- makeappx pack re-validation: exit 0"
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          catch {
            Write-Host "::error title=SDK validation failed::$($_.Exception.Message)"
            throw
          }

      - name: Install test (Add-AppxPackage + Start entry + Edge host + permissions)
        id: install
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          $msix = "dist/windows/$($env:PKG_BASE)_$($env:PKG_VERSION)_neutral.test-signed.msix"
          $cer = 'dist/windows/NEXORA-AI-test-certificate.cer'
          ./windows/scripts/Test-MsixInstall.ps1 -MsixPath $msix -CertificatePath $cer `
            -TrustMachineRoot -AllowLaunchFailure -OutputJson dist/windows/install-test.json

      - name: Upload install-test evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-test
          path: |
            dist/windows/install-test.json
            dist/windows/BUILD-INFO.txt
            dist/windows/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Assert install test result
        shell: pwsh
        run: |
          if (-not (Test-Path dist/windows/install-test.json)) { throw 'install-test.json was not produced — the install test did not run.' }
          $json = Get-Content dist/windows/install-test.json -Raw | ConvertFrom-Json
          Write-Host ($json | ConvertTo-Json -Depth 6)
          foreach ($check in @($json.checks)) {
            Write-Host ("[{0}] {1} — {2}" -f $check.status, $check.check, $check.detail)
            if ($check.status -eq 'FAIL') {
              Write-Host "::error title=install-check-$($check.check)::$($check.detail)"
            }
          }
          node windows/tools/assert-install-test.mjs dist/windows/install-test.json --allow-headless
          if ($LASTEXITCODE -ne 0) { throw 'The Windows package did not install/register correctly — see the per-check errors above.' }

      - name: Experiment — is runFullTrust really required?
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          $msix = "dist/windows/$($env:PKG_BASE)_$($env:PKG_VERSION)_neutral.msix"
          ./windows/scripts/Test-RunFullTrustNecessity.ps1 -SourceMsix $msix -OutputDirectory dist/runfulltrust-experiment

      - name: Report runFullTrust experiment
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path dist/runfulltrust-experiment/experiment-status.json) {
            Get-Content dist/runfulltrust-experiment/experiment-status.json -Raw | Write-Host
          }
          if (Test-Path dist/runfulltrust-experiment/install-test-no-fulltrust.json) {
            Get-Content dist/runfulltrust-experiment/install-test-no-fulltrust.json -Raw
            $json = Get-Content dist/runfulltrust-experiment/install-test-no-fulltrust.json -Raw | ConvertFrom-Json
            $install = @($json.checks | Where-Object { $_.check -eq 'add-appxpackage' })[0]
            $launch = @($json.checks | Where-Object { $_.check -eq 'launch-edge-host' })[0]
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "`n### runFullTrust experiment (package built WITHOUT the capability)`n- Add-AppxPackage: **$($install.status)** — $($install.detail)`n- Edge host launch: **$($launch.status)** — $($launch.detail)`n"
          }

      - name: SHA-256 of the deliverables
        shell: pwsh
        run: |
          Get-ChildItem dist/windows -File | Where-Object { $_.Extension -in @('.msix', '.msixbundle', '.msixupload', '.cer', '.txt') } |
            ForEach-Object { $h = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "{0}  {1}  {2} bytes" -f $h, $_.Name, $_.Length }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-${{ env.PKG_VERSION }}
          path: |
            dist/windows/*
            dist/runfulltrust-experiment/*
          if-no-files-found: error

      - name: Commit packages and verification to the branch (optional)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.commit_artifacts) || contains(github.event.head_commit.message, '[commit-artifacts]') }}
        shell: pwsh
        run: |
          $target = 'windows/release/4.4.1.0'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item 'dist/windows/*' -Destination $target -Recurse -Force
          if (Test-Path 'dist/windows/install-test.json') { Copy-Item 'dist/windows/install-test.json' -Destination $target -Force }
          if (Test-Path 'dist/runfulltrust-experiment') { Copy-Item 'dist/runfulltrust-experiment' -Destination $target -Recurse -Force }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add $target
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'nothing to commit'; exit 0 }
          git commit -m "build(windows): NEXORA AI by BECETTI 4.4.1.0 packages and verification [skip ci]"
          git push
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-v4.4.1.0'
          $notes = @'
          حزمة Windows النهائية لـ **NEXORA AI by BECETTI** — الإصدار `4.4.1.0` (Hosted App Model).

          - `NEXORA-AI_4.4.1.0_neutral.msixupload` — **ارفع هذا الملف إلى Partner Center**. غير موقّع عمدًا؛ Microsoft Store يوقّعه أثناء الاعتماد.
          - `NEXORA-AI_4.4.1.0_neutral.msixbundle` و`.msix` — نسخ فحص (غير موقّعة).
          - `NEXORA-AI_4.4.1.0_neutral.test-signed.msix` + `NEXORA-AI-test-certificate.cer` — للتثبيت المحلي فقط.
          - `install-test.json` — نتيجة اختبار `Add-AppxPackage` الحقيقي على Windows (التثبيت، الهوية، الصلاحيات، تشغيل Edge).
          - `runfulltrust-experiment/` — قياس ما يحدث عند إزالة `runFullTrust` (دليل فقط، غير للنشر).
          - `SHA256SUMS.txt` و`BUILD-INFO.txt` — البصمات وتفاصيل البناء.

          الهوية لم تتغيّر: `Ahmedbecetti.NEXORAAIbyBECETTI` · `CN=A5D5DC31-4A15-4059-8030-D96C51054596` · PFN `Ahmedbecetti.NEXORAAIbyBECETTI_y0zvy3a8v70hm` · Product ID `9ND09PBRDPKZ`.
          '@
          function Invoke-Gh([string[]]$GhArgs, [string]$What) {
            $output = & gh @GhArgs 2>&1
            $code = $LASTEXITCODE
            foreach ($line in $output) { Write-Host $line }
            if ($code -ne 0) { Write-Host "::error title=$What::exit $code - $($output -join ' / ')" }
            return $code
          }

          gh auth status 2>&1 | Write-Host
          $exists = Invoke-Gh @('release', 'view', $tag) 'release-view'
          if ($exists -ne 0) {
            $created = Invoke-Gh @('release', 'create', $tag, '--title', 'NEXORA AI by BECETTI · Windows 4.4.1.0', '--notes', $notes, '--target', $env:GITHUB_SHA) 'release-create'
            if ($created -ne 0) { throw "gh release create failed with exit code $created" }
          }
          else {
            $edited = Invoke-Gh @('release', 'edit', $tag, '--title', 'NEXORA AI by BECETTI · Windows 4.4.1.0', '--notes', $notes) 'release-edit'
            if ($edited -ne 0) { throw "gh release edit failed with exit code $edited" }
          }
          $files = @(Get-ChildItem dist/windows -File | ForEach-Object { $_.FullName })
          $files += @(Get-ChildItem dist/runfulltrust-experiment -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'no package files to upload' }
          $uploadArgs = @('release', 'upload', $tag) + $files + @('--clobber')
          $uploaded = Invoke-Gh $uploadArgs 'release-upload'
          if ($uploaded -ne 0) { throw "gh release upload failed with exit code $uploaded" }
          Write-Host "Published $($files.Count) files to release $tag" 

      - name: Summary
        shell: pwsh
        run: |
          $lines = @(
            '## NEXORA AI by BECETTI — Windows 4.4.1.0',
            '',
            '| File | Size | SHA-256 |',
            '|---|---:|---|'
          )
          Get-ChildItem dist/windows -File | Where-Object { $_.Extension -in @('.msix', '.msixbundle', '.msixupload') } | ForEach-Object {
            $lines += "| ``$($_.Name)`` | $($_.Length) | `$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())` |"
          }
          $lines += ''
          $lines += 'Release: https://github.com/' + $env:GITHUB_REPOSITORY + '/releases/tag/windows-v4.4.1.0'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n")
