name: Build Windows Store package

# This workflow replaces the old PWABuilder image-service path, which returned
# 500/503 and could not produce a package. It builds the Hosted App Model MSIX
# locally on a Windows runner with the Microsoft Windows SDK.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish/replace the public release assets (only after a successful Windows install test)'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/windows-store-package.yml'
      - 'windows/scripts/Build-Msix.ps1'
      - 'windows/scripts/Test-MsixPackage.ps1'
      - 'windows/msix/**'
      - 'windows/package-identity.json'
      - 'public/manifest.webmanifest'

permissions:
  contents: write

jobs:
  windows-package:
    name: Build and publish MSIX
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package version
        id: meta
        shell: pwsh
        run: |
          $identity = Get-Content windows/package-identity.json -Raw | ConvertFrom-Json
          Write-Host "version=$($identity.version)"
          "version=$($identity.version)" >> $env:GITHUB_OUTPUT

      - name: Verify Windows readiness
        shell: pwsh
        run: node windows/tools/check-windows.mjs

      - name: Smoke-test the hosted PWA (best effort)
        timeout-minutes: 2
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $page = Invoke-WebRequest -Uri 'https://nexora-social-2026.vercel.app/?nx_surface=msix' -UseBasicParsing -TimeoutSec 45 -Headers @{ 'User-Agent' = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' }
            Write-Host "PWA HTTP $($page.StatusCode), $($page.Content.Length) chars"
            if ($page.StatusCode -ne 200) { throw "Hosted PWA returned HTTP $($page.StatusCode)." }
            if ($page.Content -notmatch 'NEXORA') { throw 'Hosted PWA HTML does not contain the NEXORA app shell.' }
            $webManifest = Invoke-WebRequest -Uri 'https://nexora-social-2026.vercel.app/manifest.webmanifest' -UseBasicParsing -TimeoutSec 45 -Headers @{ 'User-Agent' = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' }
            $manifestText = if ($webManifest.Content -is [byte[]]) { [Text.Encoding]::UTF8.GetString($webManifest.Content) } else { [string]$webManifest.Content }
            if ($manifestText -notmatch '"name"\s*:') { throw 'Web app manifest has no name field.' }
            Write-Host "Hosted PWA OK: HTTP $($page.StatusCode), manifest $($manifestText.Length) chars"
          }
          catch {
            Write-Host "::warning title=Hosted PWA smoke failed::$($_.Exception.Message)"
            throw
          }

      - name: Build unsigned Store package and test-signed copy
        shell: pwsh
        run: ./windows/scripts/Build-Msix.ps1 -OutputDirectory dist/windows

      - name: Show output
        shell: pwsh
        run: Get-ChildItem dist/windows | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-${{ steps.meta.outputs.version }}
          path: dist/windows/*
          if-no-files-found: error

      - name: Trust the ephemeral test certificate
        timeout-minutes: 3
        shell: powershell
        run: |
          $cert = Join-Path $PWD 'dist\windows\NEXORA-AI-test-certificate.cer'
          if (-not (Test-Path -LiteralPath $cert)) { throw "Test certificate missing: $cert" }
          Import-Certificate -FilePath $cert -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null
          # certutil يضيف إلى Root بصمت، بخلاف Import-Certificate الذي يفتح حوار أمان.
          certutil.exe -addstore -f Root $cert | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "certutil failed to trust the test certificate (exit $LASTEXITCODE)." }

      - name: Install and inspect the package
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $details = ($_ | Out-String)
            Write-Host "::error title=MSIX install failed::$($_.Exception.Message)"
            Write-Host $details
            exit 1
          }
          $msix = Get-ChildItem -LiteralPath 'dist\windows' -Filter '*.test-signed.msix' | Select-Object -First 1
          if (-not $msix) { throw 'The test-signed MSIX is missing from the build output.' }
          Write-Host "Installing $($msix.Name)"
          Add-AppxPackage -Path $msix.FullName -ForceApplicationShutdown

          $pkg = Get-AppxPackage -Name 'Ahmedbecetti.NEXORAAIbyBECETTI'
          if (-not $pkg) { throw 'Package registration did not produce an installed package.' }
          Write-Host "Installed: $($pkg.PackageFullName)"
          Write-Host "Status:    $($pkg.Status)"

          $identity = Get-Content windows/package-identity.json -Raw | ConvertFrom-Json
          if ($pkg.Name -ne $identity.identityName) { throw "Identity Name mismatch: $($pkg.Name)" }
          if ($pkg.Publisher -ne $identity.publisher) { throw "Publisher mismatch: $($pkg.Publisher)" }
          if ($pkg.Version.ToString() -ne $identity.version) { throw "Version mismatch: $($pkg.Version)" }
          if ($pkg.PackageFamilyName -ne $identity.packageFamilyName) { throw "PFN mismatch: $($pkg.PackageFamilyName)" }
          if ($identity.productId -ne '9ND09PBRDPKZ') { throw "Product ID changed: $($identity.productId)" }
          Write-Host "Identity OK: $($pkg.Name) · $($pkg.Version) · $($pkg.PackageFamilyName)"

          $manifest = Get-AppxPackageManifest -Package $pkg.PackageFullName
          if ($manifest.Package.Properties.DisplayName -ne 'NEXORA AI by BECETTI') { throw "DisplayName mismatch: $($manifest.Package.Properties.DisplayName)" }
          if ($manifest.Package.Properties.PublisherDisplayName -ne 'Ahmedbecetti') { throw "PublisherDisplayName mismatch: $($manifest.Package.Properties.PublisherDisplayName)" }
          $caps = @(
            $manifest.Package.Capabilities.SelectNodes("*[local-name()='Capability']") |
              ForEach-Object { $_.GetAttribute('Name') }
          )
          Write-Host "Capabilities: $($caps -join ', ')"
          if ($caps -notcontains 'runFullTrust') { throw 'runFullTrust is missing; Edge host runtime dependency requires it (0x80073D2F).' }
          if ($caps -notcontains 'internetClient') { throw 'internetClient is missing from the installed package.' }

          if (Get-Command Get-StartApps -ErrorAction SilentlyContinue) {
            $startApp = Get-StartApps |
              Where-Object { $_.AppID -like "$($pkg.PackageFamilyName)!*" } |
              Select-Object -First 1
            if (-not $startApp) { throw 'No Start entry was registered for the installed package.' }
            Write-Host "Start entry: $($startApp.Name) [$($startApp.AppID)]"
          }
          else {
            Write-Warning 'Get-StartApps is unavailable; Start-menu registration was not verified.'
          }

      - name: Launch through the Edge PWA host
        timeout-minutes: 3
        shell: powershell
        run: |
          $pkg = Get-AppxPackage -Name 'Ahmedbecetti.NEXORAAIbyBECETTI'
          if (-not $pkg) { throw 'Package is not installed.' }
          $before = @(Get-Process -Name msedge -ErrorAction SilentlyContinue).Count
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!App"
          $after = $before
          for ($i = 0; $i -lt 30 -and $after -le $before; $i++) {
            Start-Sleep -Seconds 1
            $after = @(Get-Process -Name msedge -ErrorAction SilentlyContinue).Count
          }
          Write-Host "Edge processes before=$before after=$after"
          if ($after -le $before) { throw 'Edge host did not start within 30 seconds.' }
          Write-Host 'Edge PWA host is running under the package activation.'

      - name: Uninstall
        timeout-minutes: 2
        shell: powershell
        if: always()
        run: |
          Get-AppxPackage -Name 'Ahmedbecetti.NEXORAAIbyBECETTI' |
            Remove-AppxPackage -ErrorAction SilentlyContinue

      # لا تُستبدل أصول Release تلقائياً من فرع تجريبي. النشر يتطلب
      # تشغيلاً يدوياً مع publish_release=true بعد اختبار التثبيت على Windows.
      - name: Publish GitHub release assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $tag = "windows-v$version"
          $notes = @'
          حزمة Windows الحقيقية لـ **NEXORA AI by BECETTI** (Hosted App Model).

          - `NEXORA-AI___VERSION___neutral.msixupload` — ارفع هذا الملف إلى Partner Center. غير موقّع عمدًا؛ Microsoft Store يعيد توقيعه.
          - `NEXORA-AI___VERSION___neutral.msixbundle` و`.msix` — نسخ فحص غير موقّعة.
          - `NEXORA-AI___VERSION___neutral.test-signed.msix` + `NEXORA-AI-test-certificate.cer` — للاختبار المحلي فقط (تثبيت الشهادة في Trusted People). لا ترفعها إلى المتجر.
          - `SHA256SUMS.txt` و`BUILD-INFO.txt` — البصمات وتفاصيل البناء.

          الاسم المحجوز: `NEXORA AI by BECETTI` · الهوية: `Ahmedbecetti.NEXORAAIbyBECETTI` · `CN=A5D5DC31-4A15-4059-8030-D96C51054596` · الإصدار `__VERSION__`.
          '@
          $notes = $notes.Replace('__VERSION__', $version)
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "NEXORA AI by BECETTI · Windows $version" --notes $notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
          else {
            gh release edit $tag --title "NEXORA AI by BECETTI · Windows $version" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
          }
          gh release upload $tag dist/windows/* --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
