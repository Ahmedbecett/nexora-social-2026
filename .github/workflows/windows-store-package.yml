name: Build Windows Store package

# Builds the real Hosted App Model MSIX on a Windows runner with the Microsoft
# Windows SDK (makepri + makeappx + signtool), installs it with Add-AppxPackage,
# launches the Edge PWA host, checks the declared capabilities, and publishes the
# artifacts for Microsoft Partner Center.
#
# Release 4.4.1.0:
#   * Store name "NEXORA AI by BECETTI" in Properties and VisualElements;
#   * Package Identity Name / Publisher / PublisherDisplayName / PFN / Product ID unchanged;
#   * runFullTrust reviewed and justified (docs/windows/RUNFULLTRUST-REVIEW.md);
#   * .msix + .msixbundle + .msixupload (unsigned for the Store, which re-signs);
#   * Add-AppxPackage install test, Start entry, host launch, permission and identity checks.
on:
  workflow_dispatch:
    inputs:
      commit_artifacts:
        description: 'Commit the built packages and the verification JSON to this branch'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/windows-store-package.yml'
      - 'windows/**'
      - 'docs/windows/**'
      - 'package.json'
      - 'public/manifest.webmanifest'

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Build, install and publish MSIX
    runs-on: windows-latest
    env:
      PKG_VERSION: 4.4.1.0
      PKG_BASE: NEXORA-AI
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify version and Windows readiness
        shell: pwsh
        run: |
          node windows/tools/sync-version.mjs --check
          if ($LASTEXITCODE -ne 0) { throw 'MSIX version does not match package.json' }
          node windows/tools/check-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows readiness check failed' }

      - name: Build unsigned Store package and test-signed copy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Start-Transcript -Path dist/build.log -Force | Out-Null
          try {
            ./windows/scripts/Build-Msix.ps1 -OutputDirectory dist/windows
            if ($LASTEXITCODE -ne 0) { throw "Build-Msix.ps1 exited with code $LASTEXITCODE" }
          }
          catch {
            $message = $_.Exception.Message
            Write-Host "::error title=MSIX build failed::$message"
            Stop-Transcript | Out-Null
            throw
          }
          Stop-Transcript | Out-Null

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: dist/build.log
          if-no-files-found: warn

      - name: Show package files
        shell: pwsh
        run: |
          Get-ChildItem dist/windows | Format-Table Name, Length
          Get-Content dist/windows/BUILD-INFO.txt

      - name: Install test (Add-AppxPackage + Start entry + Edge host + permissions)
        id: install
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          $msix = "dist/windows/$($env:PKG_BASE)_$($env:PKG_VERSION)_neutral.test-signed.msix"
          $cer = 'dist/windows/NEXORA-AI-test-certificate.cer'
          ./windows/scripts/Test-MsixInstall.ps1 -MsixPath $msix -CertificatePath $cer `
            -TrustMachineRoot -AllowLaunchFailure -OutputJson dist/windows/install-test.json

      - name: Upload install-test evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-test
          path: |
            dist/windows/install-test.json
            dist/windows/BUILD-INFO.txt
            dist/windows/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Assert install test result
        shell: pwsh
        run: |
          if (-not (Test-Path dist/windows/install-test.json)) { throw 'install-test.json was not produced — the install test did not run.' }
          $json = Get-Content dist/windows/install-test.json -Raw | ConvertFrom-Json
          Write-Host ($json | ConvertTo-Json -Depth 6)
          foreach ($check in @($json.checks)) {
            Write-Host ("[{0}] {1} — {2}" -f $check.status, $check.check, $check.detail)
            if ($check.status -eq 'FAIL') {
              Write-Host "::error title=install-check-$($check.check)::$($check.detail)"
            }
          }
          node windows/tools/assert-install-test.mjs dist/windows/install-test.json --allow-headless
          if ($LASTEXITCODE -ne 0) { throw 'The Windows package did not install/register correctly — see the per-check errors above.' }

      - name: Experiment — is runFullTrust really required?
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          $msix = "dist/windows/$($env:PKG_BASE)_$($env:PKG_VERSION)_neutral.msix"
          ./windows/scripts/Test-RunFullTrustNecessity.ps1 -SourceMsix $msix -OutputDirectory dist/runfulltrust-experiment

      - name: Report runFullTrust experiment
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path dist/runfulltrust-experiment/install-test-no-fulltrust.json) {
            Get-Content dist/runfulltrust-experiment/install-test-no-fulltrust.json -Raw
            $json = Get-Content dist/runfulltrust-experiment/install-test-no-fulltrust.json -Raw | ConvertFrom-Json
            $install = @($json.checks | Where-Object { $_.check -eq 'add-appxpackage' })[0]
            $launch = @($json.checks | Where-Object { $_.check -eq 'launch-edge-host' })[0]
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "`n### runFullTrust experiment (package built WITHOUT the capability)`n- Add-AppxPackage: **$($install.status)** — $($install.detail)`n- Edge host launch: **$($launch.status)** — $($launch.detail)`n"
          }

      - name: SHA-256 of the deliverables
        shell: pwsh
        run: |
          Get-ChildItem dist/windows -File | Where-Object { $_.Extension -in @('.msix', '.msixbundle', '.msixupload', '.cer', '.txt') } |
            ForEach-Object { $h = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "{0}  {1}  {2} bytes" -f $h, $_.Name, $_.Length }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-${{ env.PKG_VERSION }}
          path: |
            dist/windows/*
            dist/runfulltrust-experiment/*
          if-no-files-found: error

      - name: Commit packages and verification to the branch (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_artifacts }}
        shell: pwsh
        run: |
          $target = 'windows/release/4.4.1.0'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item 'dist/windows/*' -Destination $target -Recurse -Force
          if (Test-Path 'dist/windows/install-test.json') { Copy-Item 'dist/windows/install-test.json' -Destination $target -Force }
          if (Test-Path 'dist/runfulltrust-experiment') { Copy-Item 'dist/runfulltrust-experiment' -Destination (Join-Path $target 'runfulltrust-experiment') -Recurse -Force }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add $target
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'nothing to commit'; exit 0 }
          git commit -m "build(windows): NEXORA AI by BECETTI 4.4.1.0 packages and verification [skip ci]"
          git push
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-v4.4.1.0'
          $notes = @'
          حزمة Windows النهائية لـ **NEXORA AI by BECETTI** — الإصدار `4.4.1.0` (Hosted App Model).

          - `NEXORA-AI_4.4.1.0_neutral.msixupload` — **ارفع هذا الملف إلى Partner Center**. غير موقّع عمدًا؛ Microsoft Store يوقّعه أثناء الاعتماد.
          - `NEXORA-AI_4.4.1.0_neutral.msixbundle` و`.msix` — نسخ فحص (غير موقّعة).
          - `NEXORA-AI_4.4.1.0_neutral.test-signed.msix` + `NEXORA-AI-test-certificate.cer` — للتثبيت المحلي فقط.
          - `install-test.json` — نتيجة اختبار `Add-AppxPackage` الحقيقي على Windows (التثبيت، الهوية، الصلاحيات، تشغيل Edge).
          - `runfulltrust-experiment/` — قياس ما يحدث عند إزالة `runFullTrust` (دليل فقط، غير للنشر).
          - `SHA256SUMS.txt` و`BUILD-INFO.txt` — البصمات وتفاصيل البناء.

          الهوية لم تتغيّر: `Ahmedbecetti.NEXORAAIbyBECETTI` · `CN=A5D5DC31-4A15-4059-8030-D96C51054596` · PFN `Ahmedbecetti.NEXORAAIbyBECETTI_y0zvy3a8v70hm` · Product ID `9ND09PBRDPKZ`.
          '@
          function Invoke-Gh([string[]]$GhArgs, [string]$What) {
            $output = & gh @GhArgs 2>&1
            $code = $LASTEXITCODE
            foreach ($line in $output) { Write-Host $line }
            if ($code -ne 0) { Write-Host "::error title=$What::exit $code - $($output -join ' / ')" }
            return $code
          }

          gh auth status 2>&1 | Write-Host
          $exists = Invoke-Gh @('release', 'view', $tag) 'release-view'
          if ($exists -ne 0) {
            $created = Invoke-Gh @('release', 'create', $tag, '--title', 'NEXORA AI by BECETTI · Windows 4.4.1.0', '--notes', $notes, '--target', $env:GITHUB_SHA) 'release-create'
            if ($created -ne 0) { throw "gh release create failed with exit code $created" }
          }
          else {
            $edited = Invoke-Gh @('release', 'edit', $tag, '--title', 'NEXORA AI by BECETTI · Windows 4.4.1.0', '--notes', $notes) 'release-edit'
            if ($edited -ne 0) { throw "gh release edit failed with exit code $edited" }
          }
          $files = @(Get-ChildItem dist/windows -File | ForEach-Object { $_.FullName })
          $files += @(Get-ChildItem dist/runfulltrust-experiment -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'no package files to upload' }
          $uploadArgs = @('release', 'upload', $tag) + $files + @('--clobber')
          $uploaded = Invoke-Gh $uploadArgs 'release-upload'
          if ($uploaded -ne 0) { throw "gh release upload failed with exit code $uploaded" }
          Write-Host "Published $($files.Count) files to release $tag" 

      - name: Summary
        shell: pwsh
        run: |
          $lines = @(
            '## NEXORA AI by BECETTI — Windows 4.4.1.0',
            '',
            '| File | Size | SHA-256 |',
            '|---|---:|---|'
          )
          Get-ChildItem dist/windows -File | Where-Object { $_.Extension -in @('.msix', '.msixbundle', '.msixupload') } | ForEach-Object {
            $lines += "| ``$($_.Name)`` | $($_.Length) | `$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())` |"
          }
          $lines += ''
          $lines += 'Release: https://github.com/' + $env:GITHUB_REPOSITORY + '/releases/tag/windows-v4.4.1.0'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n")
