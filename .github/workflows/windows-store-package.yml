name: Build Windows Store package

# يطلب حزمة Windows (MSIX) من خدمة PWABuilder الرسمية باستخدام هوية Partner Center.
# لا يوقّع الحزمة: Microsoft Store يعيد توقيع حزم MSIX بعد الاعتماد.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-store-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Request Store package from PWABuilder
        shell: bash
        run: |
          set -euo pipefail
          cat > windows-package-options.base.json <<'JSON'
          {
            "url": "https://nexora-social-2026.vercel.app/",
            "startUrl": "https://nexora-social-2026.vercel.app/?nx_surface=msix",
            "manifestUrl": "https://nexora-social-2026.vercel.app/manifest.webmanifest",
            "packageId": "Ahmedbecetti.NEXORAAIbyBECETTI",
            "name": "NEXORA AI",
            "version": "4.4.0.0",
            "allowSigning": true,
            "generateModernPackage": true,
            "resourceLanguage": "en-us",
            "publisher": {
              "displayName": "Ahmedbecetti",
              "commonName": "CN=A5D5DC31-4A15-4059-8030-D96C51054596"
            }
          }
          JSON
          # مرّر بيان الويب نفسه حتى لا يعتمد البناء على خدمة اكتشاف المانيفست.
          jq --slurpfile manifest public/manifest.webmanifest \
            '. + {manifest: $manifest[0]}' \
            windows-package-options.base.json > windows-package-options.json
          cat windows-package-options.json
          set +e
          status=$(curl --retry 2 --retry-delay 5 --max-time 900 \
            -sS -D response-headers.txt \
            -X POST 'https://pwabuilder-windows-docker.azurewebsites.net/msix/generatezip' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/zip' \
            --data-binary @windows-package-options.json \
            -o response.bin \
            -w '%{http_code}')
          code=$?
          echo "curl_exit=$code" | tee build-status.txt
          echo "http_status=$status" | tee -a build-status.txt
          cat response-headers.txt || true
          if [ "$code" -ne 0 ] || [ "$status" != "200" ]; then
            echo '--- response body (first 2000 bytes) ---' | tee -a build-status.txt
            head -c 2000 response.bin | tee -a build-status.txt || true
            exit 1
          fi
          mv response.bin NEXORA-AI-Windows-Store.zip
          file NEXORA-AI-Windows-Store.zip | tee -a build-status.txt
          unzip -l NEXORA-AI-Windows-Store.zip | tee -a build-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXORA-AI-Windows-Store
          path: |
            NEXORA-AI-Windows-Store.zip
            response.bin
            response-headers.txt
            build-status.txt
            windows-package-options.base.json
            windows-package-options.json
          if-no-files-found: warn
          retention-days: 30
