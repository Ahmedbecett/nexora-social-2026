name: Build Windows Store package

# 1. Runs the full 226+ Node regression suite & Vite production build on ubuntu-latest.
# 2. Builds the native C# (.NET Framework 4.7.2, x64) + WebView2 + MG Ads C# SDK V1.2.1
#    MSIX package on windows-latest, runs Windows tests + smoke checks + Add-AppxPackage
#    install verification, and uploads build & test artifacts.
#
# Release publishing is gated strictly behind manual workflow_dispatch with
# publish_release=true (never auto-publishes before verification).
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub release assets after all checks pass (keep false until QA passes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    paths:
      - '.github/workflows/windows-store-package.yml'
      - 'windows/**'
      - 'src/ads/**'
      - 'public/windows/ads-config.json'
      - 'public/manifest.webmanifest'
      - 'package.json'

permissions:
  contents: write

jobs:
  regression-tests:
    name: Full regression tests & production web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies, build web bundle, run all tests
        env:
          STUDIO_ALLOW_KEYLESS: '0'
        run: |
          npm ci
          npm run build
          if ! node --test --test-concurrency=1 tests/*.test.mjs > /tmp/test.log 2>&1; then
            grep -E "not ok|AssertionError|Error:|# fail" /tmp/test.log | head -n 20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            cat /tmp/test.log
            exit 1
          fi
          node windows/tools/sync-version.mjs --check
          node windows/tools/check-windows.mjs

  windows-package:
    name: Build, verify and package MSIX (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Windows MSIX, MG Ads & readiness tests
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = & node --test `
            tests/version-consistency.test.mjs `
            tests/windows-ads.test.mjs `
            tests/windows-msix.test.mjs `
            tests/windows-privacy.test.mjs `
            tests/windows-pwa.test.mjs `
            tests/mg-ads-native-host.test.mjs `
            tests/ad-slot-visibility.test.mjs `
            tests/adsterra-web.test.mjs `
            tests/monetag-web.test.mjs 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            ($out | Select-String -Pattern 'not ok|Error|Assertion' | Select-Object -First 10) | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit $code
          }
          node windows/tools/sync-version.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node windows/tools/check-windows.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native C# + WebView2 + MG Ads MSIX package
        shell: pwsh
        env:
          # Optional GitHub Actions Secret (never stored in repo, never printed).
          # When set, embedded strictly into native AES-encrypted build vault and deleted right after compile.
          MG_ADS_SECRET_KEY: ${{ secrets.MG_ADS_SECRET_KEY }}
        run: |
          try {
            ./windows/scripts/Build-Msix.ps1 -OutputDirectory dist/windows
          }
          catch {
            Write-Host "::error::$($_.Exception.Message)"
            throw
          }

      - name: Verify test-signed MSIX installs cleanly on Windows
        shell: pwsh
        run: |
          try {
            $identity = Get-Content -LiteralPath windows/package-identity.json -Raw | ConvertFrom-Json
            $version = $identity.version
            $testMsix = "dist/windows/NEXORA-AI_${version}_x64.test-signed.msix"
            $testCer = "dist/windows/NEXORA-AI-test-certificate.cer"

            if (-not (Test-Path -LiteralPath $testMsix)) { throw "Missing test-signed MSIX: $testMsix" }
            if (-not (Test-Path -LiteralPath $testCer)) { throw "Missing test certificate: $testCer" }

            Import-Certificate -FilePath $testCer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            Add-AppxPackage -Path $testMsix

            $pkg = Get-AppxPackage -Name $identity.identityName
            if (-not $pkg) { throw "Package $($identity.identityName) not found after Add-AppxPackage." }

            $installedExe = Join-Path $pkg.InstallLocation 'NexoraWindows.exe'
            $installedMgDll = Join-Path $pkg.InstallLocation 'MiracleGamesAd.dll'
            $installedWvDll = Join-Path $pkg.InstallLocation 'Microsoft.Web.WebView2.Core.dll'
            $installedCfg = Join-Path $pkg.InstallLocation 'Config\mgads-config.json'
            if (-not (Test-Path -LiteralPath $installedExe)) { throw "Installed executable missing: $installedExe" }
            if (-not (Test-Path -LiteralPath $installedMgDll)) { throw "Installed MiracleGamesAd.dll missing: $installedMgDll" }
            if (-not (Test-Path -LiteralPath $installedWvDll)) { throw "Installed WebView2 DLL missing: $installedWvDll" }
            if (-not (Test-Path -LiteralPath $installedCfg)) { throw "Installed mgads-config.json missing: $installedCfg" }
            if ($pkg.Version -ne $identity.version) { throw "Installed version mismatch: $($pkg.Version) != $($identity.version)" }
            if ($pkg.PackageFamilyName -ne $identity.packageFamilyName) { throw "PFN mismatch: $($pkg.PackageFamilyName) != $($identity.packageFamilyName)" }

            $smokeObj = Get-Content -LiteralPath dist/windows/smoke-check.json -Raw | ConvertFrom-Json
            if (-not $smokeObj.ok) { throw 'Native host smoke-check.json reported ok=false.' }

            $installReport = [ordered]@{
              installed = $true
              packageFullName = $pkg.PackageFullName
              packageFamilyName = $pkg.PackageFamilyName
              version = $pkg.Version
              architecture = [string]$pkg.Architecture
              status = [string]$pkg.Status
              installLocationExists = (Test-Path -LiteralPath $pkg.InstallLocation)
              executablePresent = (Test-Path -LiteralPath $installedExe)
              mgAdsSdkDllPresent = (Test-Path -LiteralPath $installedMgDll)
              webView2DllPresent = (Test-Path -LiteralPath $installedWvDll)
              mgAdsConfigPresent = (Test-Path -LiteralPath $installedCfg)
              smokeCheck = $smokeObj
              verifiedAtUtc = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            }

            $installReport | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath dist/windows/install-test.json -Encoding UTF8
            Get-Content -LiteralPath dist/windows/install-test.json

            Remove-AppxPackage -Package $pkg.PackageFullName
          }
          catch {
            Write-Host "::error::$($_.Exception.Message)"
            throw
          }

      - name: Show generated artifacts
        shell: pwsh
        run: Get-ChildItem dist/windows | Format-Table Name, Length

      - name: Upload build and verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-4.5.0.0-x64
          path: dist/windows/*
          if-no-files-found: error

      - name: Publish GitHub release assets (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $identity = Get-Content -LiteralPath windows/package-identity.json -Raw | ConvertFrom-Json
          $smoke = Get-Content -LiteralPath dist/windows/smoke-check.json -Raw | ConvertFrom-Json
          $version = $identity.version
          $tag = "windows-v${version}"
          $secretFlag = if ($smoke.secretConfigured) { 'YES (embedded in native AES vault)' } else { 'NO (add MG_ADS_SECRET_KEY in repo secrets and re-run build before Store upload)' }
          $notes = @"
          NEXORA AI by BECETTI — Windows Store MSIX (${version}, x64 Native C# + WebView2 + MG Ads C# SDK V1.2.1).

          - ``NEXORA-AI_${version}_x64.msixupload`` — Upload to Microsoft Partner Center (UNSIGNED; Store re-signs).
          - ``NEXORA-AI_${version}_x64.msixbundle`` & ``.msix`` — Unsigned inspection artifacts.
          - ``NEXORA-AI_${version}_x64.test-signed.msix`` + ``NEXORA-AI-test-certificate.cer`` — Local sideload QA only.
          - ``smoke-check.json`` & ``install-test.json`` — Automated Windows verification reports.
          - ``SHA256SUMS.txt`` & ``BUILD-INFO.txt`` — Checksums and build metadata.

          Identity: ``$($identity.identityName)`` · ``$($identity.publisher)`` · PFN ``$($identity.packageFamilyName)`` · Store Product ID ``$($identity.productId)`` · MG Ads AppId ``6b03f6af1f812ea86a26de4f`` · MG Ads Secret Configured: **${secretFlag}**.
          "@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "NEXORA AI by BECETTI · Windows ${version}" --notes $notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
          else {
            gh release edit $tag --prerelease --title "NEXORA AI by BECETTI · Windows ${version}" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
          }
          gh release upload $tag dist/windows/* --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
