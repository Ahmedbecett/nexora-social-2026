name: Build Nexora APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: https://nexora-social-2026.vercel.app
      VITE_WEB_URL: https://nexora-social-2026.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          node scripts/check-android-firebase.mjs

      - name: Require stable signing for published APKs
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.NEXORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Published APKs require a stable release keystore with its SHA registered in Firebase."
            exit 1
          fi

      - name: Install & build web app
        run: |
          npm ci
          npm test
          npm run build
          rm -rf dist/download
          npx cap sync android

      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.NEXORA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/nexora.jks
            echo "NEXORA_KEYSTORE=$RUNNER_TEMP/nexora.jks" >> $GITHUB_ENV
          fi

      - name: Build release APK
        env:
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.NEXORA_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.NEXORA_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          echo "=== APK outputs ==="
          ls -lah app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk ../Nexora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-apk
          path: Nexora.apk

      - name: Update the website download link (public/download/Nexora.apk)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/download
          cp Nexora.apk public/download/Nexora.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/download/Nexora.apk
          git diff --cached --quiet || git commit -m "chore: refresh Nexora.apk for the website [skip ci]"
          git push

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Nexora — latest Android build" --notes "Latest APK built automatically from main."
          gh release upload latest Nexora.apk --clobber
          gh release edit latest --notes "Latest APK built automatically from commit ${GITHUB_SHA::7}. Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Nexora.apk"
