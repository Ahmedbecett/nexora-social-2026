name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp

      - name: Verify Android project configuration
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          /tmp/gradle-8.9/bin/gradle --version

      - name: Build debug APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="apk-build-${RUN_NUMBER}"
          gh release create "${TAG}" app/build/outputs/apk/debug/app-debug.apk \
            --title "NEXORA Android APK build ${RUN_NUMBER}" \
            --notes "Automatically built debug APK from commit ${GITHUB_SHA}. This is an unsigned debug build for testing, not a Play Store release."
